name: ccgh
description: Run a ccgh command against the repository being checked out, without installing anything in it.

inputs:
  command:
    description: The whole ccgh command, such as "validate" or "bridge push".
    required: true
  token:
    description: >-
      The token the bridge writes with. Defaults to the one the workflow already has, so that
      a consumer's workflow never has to plumb it through — GitHub does not put it in the
      environment on its own, and every verb refuses without it.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    # Where GitHub unpacked this action, never the consumer's checkout — which may not be a
    # JavaScript project at all.
    - run: bun install --frozen-lockfile
      shell: bash
      working-directory: ${{ github.action_path }}

    # Whoever the bridge commits as. It writes issue numbers back onto iteration branches, and
    # git refuses a commit from nobody.
    - run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      shell: bash

    - run: ${{ github.action_path }}/bin/ccgh ${{ inputs.command }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
