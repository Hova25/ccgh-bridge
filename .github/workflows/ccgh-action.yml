name: ccgh-action

# What ccgh-validate cannot prove: that the action works at the address a consumer uses.
# This repository reaches its own action by path everywhere else, so nothing else exercises
# the reference form. Pinned to main, which outlives a task branch; never to a tag, because a
# tag cannot test the commit that changes the action.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  by-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Hova25/ccgh-bridge@main
        with:
          command: validate
