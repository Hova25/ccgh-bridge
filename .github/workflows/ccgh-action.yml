name: ccgh-action

on:
  pull_request:
  push:
    branches: [main]

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # By path, never by tag: a tag cannot test the commit that changes the action.
      - uses: ./
        with:
          command: validate

      # The action runs ccgh commands; the suite is not one of them. Until the validate
      # workflow of task 9 exists, this is what stops a red test reaching main — which it
      # already did once, because the content check is green whatever the tests say.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # The other address. Same file, fetched by reference rather than taken from the checkout, so
  # that the path a consumer uses is exercised too. Pinned to `main`, which outlives a task
  # branch — the first attempt pinned the branch it was written on, and broke the moment that
  # branch was deleted by its own merge. Never a tag: a tag cannot test the commit that
  # changes the action, and this job proves the address rather than this commit.
  by-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Hova25/ccgh-bridge@main
        with:
          command: validate
